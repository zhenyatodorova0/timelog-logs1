name: Auto-delete logs older than 7 days

on:
  schedule:
    - cron: '0 2 * * *'  # runs daily at 2am UTC
  workflow_dispatch:

jobs:
  delete-old-logs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Delete files older than 7 days
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          CUTOFF=$(date -d '7 days ago' +%s)
          DELETED=0

          for file in $(git ls-files); do
            COMMIT_DATE=$(git log -1 --format="%ct" -- "$file")
            if [ -n "$COMMIT_DATE" ] && [ "$COMMIT_DATE" -lt "$CUTOFF" ]; then
              git rm "$file"
              DELETED=$((DELETED + 1))
            fi
          done

          if [ "$DELETED" -gt 0 ]; then
            git commit -m "Auto-delete: removed $DELETED log file(s) older than 7 days"
            git push
            echo "Deleted $DELETED file(s)."
          else
            echo "No files older than 7 days found."
          fi
